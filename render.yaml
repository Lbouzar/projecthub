databases:
  # PostgreSQL Database
  - name: projecthub-postgres
    databaseName: projecthub
    user: projecthub
    plan: free

services:
  # Backend API
  - type: web
    name: projecthub-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: projecthub-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: UPLOAD_MAX_SIZE
        value: 10485760
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 1000
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: projecthub-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend
  - type: web
    name: projecthub-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://projecthub-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://projecthub-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
